# Generates the Dart API client from caf-api's OpenAPI schema (NFR-39).
# Regenerate with tool/generate_api.sh; never edit lib/api/generated by hand.
swagger_parser:
  schema_path: openapi.json
  output_directory: lib/api/generated
  name: caf_api
  language: dart
  json_serializer: json_serializable
  root_client: true
  root_client_name: CafApi
  export_file: true
  put_clients_in_folder: true
  enums_to_json: true
  unknown_enum_value: true
